<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP 탈출: 제19기지 v5.0</title>
    <style>
        :root {
            --terminal-green: #33ff33;
            --terminal-dark: #080808;
            --terminal-bg: #000;
        }

        body {
            background-color: var(--terminal-dark);
            color: var(--terminal-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-container {
            width: 100%;
            max-width: 850px;
            background-color: var(--terminal-bg);
            border: 1px solid var(--terminal-green);
            padding: 25px;
            border-radius: 5px;
            box-shadow: 0 0 25px rgba(51, 255, 51, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #status-panel {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed var(--terminal-green);
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .status-item b { color: #fff; }
        .danger { color: #ff3333; font-weight: bold; }
        .safe { color: #33ccff; font-weight: bold; }

        #story-text {
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 25px;
            min-height: 250px;
        }

        #story-text b { color: #fff; }
        #story-text i { color: #aaa; }
        .warning { color: #ff9900; }

        .choice-btn {
            display: block;
            width: 100%;
            background-color: #111;
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            padding: 15px;
            margin-bottom: 10px;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .choice-btn:hover {
            background-color: var(--terminal-green);
            color: #000;
            font-weight: bold;
            padding-left: 20px;
        }

        #toast-notification {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--terminal-green);
            color: #000;
            text-align: center;
            border-radius: 2px;
            padding: 16px;
            position: absolute;
            z-index: 1;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
        }

        #toast-notification.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-panel">
        <div>
            <div class="status-item">HP: <b id="hp-display">100</b> / 100</div>
            <div class="status-item">상태: <b id="condition-display">정상</b></div>
        </div>
        <div style="text-align: right;">
            <div class="status-item">INV: <b id="inv-display">비어 있음</b></div>
        </div>
    </div>
    <div id="story-text">시스템 부팅...</div>
    <div id="choices-area"></div>
    <div id="toast-notification"></div>
</div>

<script>
    // --- 게임 시스템 ---
    let gameState = { 
        hp: 100, 
        inventory: [], 
        flags: [],
        condition: "정상" // 정상, 출혈, 감염 등
    };

    function updateScreen(text, choices) {
        document.getElementById("hp-display").innerText = gameState.hp;
        document.getElementById("hp-display").className = gameState.hp <= 30 ? "danger" : "";
        document.getElementById("condition-display").innerText = gameState.condition;
        document.getElementById("condition-display").className = gameState.condition !== "정상" ? "danger" : "safe";
        document.getElementById("inv-display").innerText = gameState.inventory.length > 0 ? gameState.inventory.join(", ") : "비어 있음";
        
        document.getElementById("story-text").innerHTML = text;
        const choicesArea = document.getElementById("choices-area");
        choicesArea.innerHTML = "";
        
        choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.innerHTML = choice.text;
            btn.onclick = choice.action;
            choicesArea.appendChild(btn);
        });
    }

    function showNotification(msg) {
        const toast = document.getElementById("toast-notification");
        toast.innerText = msg;
        toast.className = "show";
        setTimeout(() => toast.className = toast.className.replace("show", ""), 3000);
    }

    function takeDamage(amount, condition = null) {
        gameState.hp -= amount;
        if (condition) gameState.condition = condition;
        showNotification(`[경고] 체력 ${amount} 감소!`);
        return gameState.hp <= 0;
    }

    function hasItem(item) { return gameState.inventory.includes(item); }
    function hasFlag(flag) { return gameState.flags.includes(flag); }
    function setFlag(flag) { if (!hasFlag(flag)) gameState.flags.push(flag); }
    function addItem(item) { if (!hasItem(item)) { gameState.inventory.push(item); showNotification(`[+] ${item} 획득`); } }
    function removeItem(item) { const idx = gameState.inventory.indexOf(item); if (idx > -1) gameState.inventory.splice(idx, 1); }

    // ==========================================
    // 0. 프롤로그 및 허브
    // ==========================================

    function startIntro() {
        gameState = { hp: 100, inventory: [], flags: [], condition: "정상" };
        const text = "⚠️ <b>[시스템 에러] 기지 다중 격리 파기 발생.</b><br><br>당신은 D-9341. 감방 문이 열렸습니다. 밖은 이미 지옥입니다.<br>중앙 교차로에 도착했습니다. 어디로 향하시겠습니까?";
        updateScreen(text, [
            { text: "1. [저위험군 격리구역] (보안 문 통과 정석 루트)", action: lcz_hub },
            { text: "2. [사무 및 의료 구역] (아이템 및 회복)", action: admin_hub },
            { text: "3. [지하 유지보수 터널] (전력 제어 및 어둠)", action: maintenance_hub }
        ]);
    }

    // ==========================================
    // 1. 사무 및 의료 구역 (Admin & Medical)
    // ==========================================

    function admin_hub() {
        updateScreen("📍 <b>사무 구역 복도</b><br><br>비상등만 켜진 고요한 복도입니다.", [
            { text: "의료실(Medical Bay)로 들어간다.", action: med_bay },
            { text: "보안실(Security Room)로 들어간다.", action: security_room },
            { text: "중앙 교차로로 돌아간다.", action: startIntro }
        ]);
    }

    function med_bay() {
        let text = "📍 <b>의료실</b><br><br>의료 기기들이 부서져 있습니다.";
        let choices = [{ text: "복도로 나간다.", action: admin_hub }];

        if (!hasFlag("got_med_items")) {
            text += "<br>선반 위에 <b>[만병통치약 SCP-500]</b> 한 알과 <b>[1등급 키카드]</b>가 보입니다.";
            choices.unshift({ text: "아이템을 모두 챙긴다.", action: () => {
                setFlag("got_med_items"); addItem("SCP-500"); addItem("1등급 키카드"); med_bay();
            }});
        } else if (hasItem("SCP-500")) {
            choices.unshift({ text: "SCP-500을 복용한다 (체력/상태 완전 회복)", action: () => {
                removeItem("SCP-500"); gameState.hp = 100; gameState.condition = "정상";
                showNotification("모든 상처와 질병이 깨끗이 나았습니다!"); med_bay();
            }});
        }
        updateScreen(text, choices);
    }

    function security_room() {
        let text = "📍 <b>보안실</b><br><br>모니터들이 깨져 있습니다. 구석에 <b>[SCP-049]</b>가 죽은 경비병을 수술하고 있습니다.";
        let choices = [{ text: "조용히 복도로 빠져나간다.", action: admin_hub }];

        if (!hasFlag("got_sec_items")) {
            text += "<br>벽에 걸린 <b>[가스 마스크]</b>와 책상 위 <b>[건전지]</b>가 보입니다. 놈의 시선을 끌지 않고 가져올 수 있을까요?";
            choices.unshift({ text: "위험을 무릅쓰고 아이템을 훔친다.", action: () => {
                if(Math.random() < 0.3) {
                    if(takeDamage(40, "감염")) return gameOver("SCP-049에게 들켰습니다. 그의 손이 닿자 치명적인 역병에 감염되었습니다.");
                } else {
                    setFlag("got_sec_items"); addItem("가스 마스크"); addItem("건전지");
                }
                security_room();
            }});
        }
        updateScreen(text, choices);
    }

    // ==========================================
    // 2. 지하 유지보수 터널 (Maintenance)
    // ==========================================

    function maintenance_hub() {
        updateScreen("📍 <b>지하 터널</b><br><br>어둡고 습합니다. 파이프에서 증기가 새어 나옵니다.", [
            { text: "발전기실로 향한다.", action: generator_room },
            { text: "창고로 향한다.", action: storage_room },
            { text: "하수구 쪽으로 간다.", action: sewer_room },
            { text: "중앙 교차로로 올라간다.", action: startIntro }
        ]);
    }

    function storage_room() {
        let text = "📍 <b>지하 창고</b><br><br>먼지 쌓인 장비들이 널브러져 있습니다.";
        let choices = [{ text: "터널로 나간다.", action: maintenance_hub }];

        if (!hasFlag("got_storage")) {
            text += "<br>캐비닛 안에서 <b>[야간 투시경]</b>과 <b>[쇠지렛대]</b>를 발견했습니다!";
            choices.unshift({ text: "챙긴다.", action: () => {
                setFlag("got_storage"); addItem("야간 투시경"); addItem("쇠지렛대"); storage_room();
            }});
        }
        updateScreen(text, choices);
    }

    function generator_room() {
        let text = "📍 <b>메인 발전기실</b><br><br>";
        let choices = [{ text: "터널로 돌아간다.", action: maintenance_hub }];

        if (!hasFlag("power_off")) {
            text += "시설 메인 전력이 <b style='color:#33ff33'>[ON]</b> 상태입니다. 끄면 보안 문들이 풀리지만, 맹수들이 어둠을 틈타 활동할 것입니다.";
            choices.unshift({ text: "메인 전력을 차단한다.", action: () => { setFlag("power_off"); showNotification("시설 전체 전력 차단됨!"); generator_room(); }});
        } else {
            text += "전력이 <b class='danger'>[OFF]</b> 상태입니다.";
        }
        updateScreen(text, choices);
    }

    function sewer_room() {
        let text = "📍 <b>하수구 배수구</b><br><br>단단한 쇠창살이 가로막고 있습니다.";
        let choices = [{ text: "돌아간다.", action: maintenance_hub }];

        if (hasItem("쇠지렛대") && hasFlag("power_off")) {
            text += "<br>전력이 끊겨 전자 잠금장치가 무력화되었습니다. 쇠지렛대로 열 수 있습니다!";
            choices.unshift({ text: "철창을 뜯고 탈출한다 (히든 엔딩)", action: () => gameWin("오수관을 타고 기지를 빠져나왔습니다.<br>아무도 당신의 행방을 모릅니다.<br><br><b>[엔딩 1: 자유의 몸]</b>") });
        } else {
            text += "<br>잠금장치에 전류가 흐르고 있어 열 수 없습니다.";
        }
        updateScreen(text, choices);
    }

    // ==========================================
    // 3. 저위험군 격리구역 (LCZ)
    // ==========================================

    function lcz_hub() {
        let text = "📍 <b>저위험군 격리구역</b><br><br>";
        if(hasFlag("power_off")) text += "<span class='warning'>[전력 꺼짐] 칠흑같이 어둡습니다.</span><br><br>";
        
        updateScreen(text + "여러 격리실이 이어져 있습니다.", [
            { text: "SCP-914 격리실 (아이템 업그레이드)", action: scp914_room },
            { text: "가스 유출 복도로 진입", action: gas_hallway },
            { text: "중앙 교차로로 돌아간다.", action: startIntro }
        ]);
    }

    function scp914_room() {
        let text = "📍 <b>SCP-914 (만능 태엽장치)</b><br><br>기계에 아이템을 넣고 'Fine(고운)' 설정으로 돌릴 수 있습니다.";
        let choices = [{ text: "복도로 나간다.", action: lcz_hub }];

        // 업그레이드 로직
        if(hasItem("1등급 키카드")) choices.unshift({ text: "[1등급 키카드] 돌리기", action: () => { removeItem("1등급 키카드"); addItem("2등급 키카드"); scp914_room(); }});
        if(hasItem("2등급 키카드")) choices.unshift({ text: "[2등급 키카드] 돌리기", action: () => { removeItem("2등급 키카드"); addItem("3등급 키카드"); scp914_room(); }});
        if(hasItem("3등급 키카드")) choices.unshift({ text: "[3등급 키카드] 돌리기", action: () => { removeItem("3등급 키카드"); addItem("4등급 키카드"); scp914_room(); }});
        if(hasItem("4등급 키카드")) choices.unshift({ text: "[4등급 키카드] 돌리기", action: () => { removeItem("4등급 키카드"); addItem("마스터(Omni) 키카드"); scp914_room(); }});
        
        updateScreen(text, choices);
    }

    function gas_hallway() {
        let text = "📍 <b>유독가스 복도</b><br><br>파이프가 터져 노란색 맹독 가스가 가득 차 있습니다. 이 복도를 통과해야 중위험군(HCZ)으로 갈 수 있습니다.";
        let choices = [{ text: "저위험군으로 돌아간다.", action: lcz_hub }];

        if (hasItem("가스 마스크")) {
            choices.unshift({ text: "가스 마스크를 쓰고 안전하게 통과한다.", action: hcz_hub });
        } else {
            choices.unshift({ text: "숨을 참고 억지로 통과한다.", action: () => {
                if(takeDamage(50, "출혈")) return gameOver("가스를 마시고 폐가 망가져 피를 토하며 쓰러졌습니다.");
                hcz_hub();
            }});
        }
        updateScreen(text, choices);
    }

    // ==========================================
    // 4. 중위험군 격리구역 (HCZ)
    // ==========================================

    function hcz_hub() {
        let text = "📍 <b>중위험군 격리구역</b><br><br>공기가 무겁고 피비린내가 진동합니다.";
        let choices = [
            { text: "어두운 서버실로 향한다. (SCP-096 구역)", action: scp096_room },
            { text: "지하 사육장 터널로 향한다. (SCP-939 구역)", action: scp939_tunnel },
            { text: "저위험군 복도로 돌아간다.", action: gas_hallway }
        ];
        updateScreen(text, choices);
    }

    function scp096_room() {
        updateScreen("📍 <b>서버실</b><br><br>구석에서 창백한 괴물 <b>[SCP-096]</b>이 울고 있습니다.", [
            { text: "얼굴을 보지 않도록 바닥만 보며 조심스럽게 지나가 출입 구역(EZ)으로 향한다.", action: ez_hub },
            { text: "총이 떨어져 있는지 확인하려 주위를 둘러본다.", action: () => gameOver("우연히 SCP-096의 얼굴을 보고 말았습니다. 놈의 비명소리가 커지더니 순식간에 당신을 찢어버렸습니다.") }
        ]);
    }

    function scp939_tunnel() {
        let text = "📍 <b>사육장 터널</b><br><br>어둠 속에서 사람의 목소리를 흉내 내는 맹수 <b>[SCP-939]</b> 무리가 배회합니다. 놈들은 시력이 없지만 청각에 극도로 예민합니다.";
        let choices = [{ text: "서버실 쪽으로 돌아간다.", action: hcz_hub }];

        if (hasFlag("power_off")) {
            if (hasItem("야간 투시경") && hasItem("건전지")) {
                choices.unshift({ text: "야간 투시경을 켜고, 놈들을 피해 발소리를 죽여 출입 구역(EZ)으로 빠져나간다.", action: ez_hub });
            } else {
                choices.unshift({ text: "어둠 속을 감으로 더듬거리며 지나간다.", action: () => gameOver("어둠 속에서 무언가에 걸려 넘어지며 큰 소리를 냈습니다.<br>사방에서 SCP-939들이 달려들어 당신을 물어뜯었습니다.") });
            }
        } else {
            text += "<br><br>불이 켜져 있어 당신이 움직이면 쉽게 표적이 될 것입니다. 전력을 끄면 시야가 없는 놈들을 피해갈 수 있을지도 모릅니다.";
        }
        updateScreen(text, choices);
    }

    // ==========================================
    // 5. 출입 구역 (EZ) 및 엔딩
    // ==========================================

    function ez_hub() {
        updateScreen("📍 <b>출입 구역 (로비)</b><br><br><i>안내 방송: '알파 탄두 폭발까지 2분 남았습니다.'</i><br>마지막 탈출 게이트가 눈앞에 있습니다.", [
            { text: "게이트 A (혼돈의 반란 침투지)로 간다.", action: gate_a },
            { text: "게이트 B (재단 특수부대 거점)로 간다.", action: gate_b },
            { text: "시간이 없다! 그 자리에 주저앉는다.", action: () => gameOver("카운트다운이 끝났습니다.<br>거대한 핵폭발이 기지 전체를 증발시켰습니다.<br><br><b>[배드 엔딩: 잿더미]</b>") }
        ]);
    }

    function gate_a() {
        let text = "📍 <b>게이트 A</b><br><br>무장한 혼돈의 반란 요원들이 출구를 지키고 있습니다.";
        if (hasItem("마스터(Omni) 키카드") || hasItem("4등급 키카드")) {
            gameWin("<i>'잠깐, 저 놈 손에 있는 카드를 봐. 쓸만한 가치가 있겠군.'</i><br>그들은 고등급 카드를 소지한 당신을 주요 인물로 판단하고 헬기에 태웠습니다.<br><br><b>[엔딩 2: 적의 장기말]</b>");
        } else {
            gameWin("<i>'D계급이군. 화물칸에 던져넣어.'</i><br>그들은 당신을 소모품으로 포획했습니다. 노예나 다름없는 신세지만, 죽진 않았습니다.<br><br><b>[엔딩 3: 혼돈의 수감자]</b>");
        }
    }

    function gate_b() {
        let text = "📍 <b>게이트 B</b><br><br>재단 특수 기동대(MTF)가 생존자를 검문 중입니다.";
        if (gameState.condition === "감염" || gameState.hp < 50) {
            gameOver("당신의 상태를 본 MTF 요원들이 총을 겨눴습니다.<br><i>'감염 의심자다. 사살해!'</i><br><br><b>[배드 엔딩: 무자비한 방역]</b>");
        } else if (hasItem("마스터(Omni) 키카드")) {
            gameWin("당신이 내민 마스터 키카드를 본 요원들이 당황하며 경례합니다.<br><i>'O5 임원 구출 확인! 신속히 헬기로 호송하라!'</i><br>당신은 재단 최고위층으로 위장하여 완벽한 호위를 받으며 탈출했습니다.<br><br><b>[진 엔딩 4: 위대한 사기극]</b>");
        } else {
            gameOver("D계급 복장을 본 요원들이 총을 난사했습니다.<br><i>'D계급 인원 탈주 확인, 사살 완료.'</i><br><br><b>[배드 엔딩: 규정대로]</b>");
        }
    }

    function gameOver(reason) {
        document.getElementById("hp-display").innerText = "0";
        document.getElementById("hp-display").className = "danger";
        updateScreen(`<span class="danger">💀 <b>GAME OVER</b> 💀</span><br><br>${reason}`, [
            { text: "처음부터 다시 시도", action: startIntro }
        ]);
    }

    function gameWin(endingText) {
        updateScreen(`🎉 <b>시설 탈출 시퀀스 완료</b> 🎉<br><br>${endingText}`, [
            { text: "다른 엔딩 찾아보기", action: startIntro }
        ]);
    }

    window.onload = startIntro;
</script>

</body>
</html>
