<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP 탈출: 제19기지 다중 루트</title>
    <style>
        :root {
            --terminal-green: #33ff33;
            --terminal-dark: #0c0c0c;
            --terminal-bg: #000;
        }

        body {
            background-color: var(--terminal-dark);
            color: var(--terminal-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--terminal-bg);
            border: 1px solid var(--terminal-green);
            padding: 25px;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(51, 255, 51, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #status-panel {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed var(--terminal-green);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .status-item b { color: #fff; }
        .danger { color: #ff3333; font-weight: bold; }

        #story-text {
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 25px;
            min-height: 250px;
        }

        #story-text b { color: #fff; }
        #story-text i { color: #aaa; }
        .warning { color: #ff9900; }

        .choice-btn {
            display: block;
            width: 100%;
            background-color: #111;
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            padding: 15px;
            margin-bottom: 10px;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .choice-btn:hover {
            background-color: var(--terminal-green);
            color: #000;
            font-weight: bold;
            padding-left: 25px; /* 호버 시 텍스트가 살짝 이동하는 연출 */
        }

        #toast-notification {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--terminal-green);
            color: #000;
            text-align: center;
            border-radius: 2px;
            padding: 16px;
            position: absolute;
            z-index: 1;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(51, 255, 51, 0.5);
        }

        #toast-notification.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-panel">
        <div class="status-item">HP: <b id="hp-display">100</b> / 100</div>
        <div class="status-item">INV: <b id="inv-display">비어 있음</b></div>
    </div>
    <div id="story-text">시스템 부팅...</div>
    <div id="choices-area"></div>
    <div id="toast-notification"></div>
</div>

<script>
    // --- 게임 상태 및 유틸리티 ---
    let gameState = { hp: 100, inventory: [], flags: [] };

    function updateScreen(text, choices) {
        document.getElementById("hp-display").innerText = gameState.hp;
        document.getElementById("hp-display").className = gameState.hp <= 30 ? "danger" : "";
        document.getElementById("inv-display").innerText = gameState.inventory.length > 0 ? gameState.inventory.join(", ") : "비어 있음";
        document.getElementById("story-text").innerHTML = text;
        
        const choicesArea = document.getElementById("choices-area");
        choicesArea.innerHTML = "";
        choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.innerHTML = choice.text;
            btn.onclick = choice.action;
            choicesArea.appendChild(btn);
        });
    }

    function showNotification(msg) {
        const toast = document.getElementById("toast-notification");
        toast.innerText = msg;
        toast.className = "show";
        setTimeout(() => toast.className = toast.className.replace("show", ""), 3000);
    }

    function takeDamage(amount) {
        gameState.hp -= amount;
        showNotification(`[경고] 체력 ${amount} 감소!`);
        return gameState.hp <= 0;
    }

    function hasItem(item) { return gameState.inventory.includes(item); }
    function hasFlag(flag) { return gameState.flags.includes(flag); }
    function setFlag(flag) { if (!hasFlag(flag)) gameState.flags.push(flag); }
    function addItem(item) { if (!hasItem(item)) { gameState.inventory.push(item); showNotification(`[+] ${item} 획득`); } }
    function removeItem(item) { const idx = gameState.inventory.indexOf(item); if (idx > -1) gameState.inventory.splice(idx, 1); }

    // ==========================================
    // 시나리오 시작 (분기점 허브)
    // ==========================================

    function startIntro() {
        gameState = { hp: 100, inventory: [], flags: [] };
        const text = "⚠️ <b>[긴급 경보] 기지 전체 다중 격리 파기.</b><br><br>당신은 D-9341. 폭발음과 함께 감방 문이 열렸습니다. 복도로 나오니 세 갈래 길이 보입니다.<br>사이렌 소리가 귀를 찢을 듯 울립니다. 어느 길로 가야 할까요?";
        updateScreen(text, [
            { text: "1. [저위험군 격리구역] 표지판을 따라간다. (정석 루트)", action: lcz_hub },
            { text: "2. [사무 및 연구 구역] 통로로 진입한다. (아이템 파밍 루트)", action: admin_hub },
            { text: "3. 어두컴컴한 [지하 유지보수 터널] 계단으로 내려간다. (위험/비밀 루트)", action: maintenance_hub }
        ]);
    }

    // ==========================================
    // 루트 1: 사무 구역 (Admin Wing) - 정보와 아이템
    // ==========================================

    function admin_hub() {
        let text = "📍 <b>사무 구역 복도</b><br><br>연구원들과 경비병들의 시체가 널려 있습니다. 피비린내가 코를 찌릅니다.<br>오른쪽에는 '소장실'이 있고, 앞쪽은 '식당'입니다.";
        updateScreen(text, [
            { text: "소장실로 들어간다.", action: admin_director },
            { text: "식당으로 간다.", action: admin_cafeteria },
            { text: "다시 시작 지점(D계급 감방)으로 돌아간다.", action: startIntro }
        ]);
    }

    function admin_director() {
        let text = "📍 <b>소장실</b><br><br>고급스러운 책상 위에 각종 서류가 흩어져 있습니다.";
        let choices = [{ text: "사무 구역 복도로 나간다.", action: admin_hub }];

        if (!hasFlag("got_admin_items")) {
            text += "<br>책상 서랍이 반쯤 열려 있고, 그 안에 <b>[4등급 키카드]</b>와 <b>[쇠지렛대(빠루)]</b>가 보입니다!";
            choices.unshift({ 
                text: "아이템들을 챙긴다.", 
                action: () => {
                    setFlag("got_admin_items");
                    addItem("4등급 키카드");
                    addItem("쇠지렛대");
                    admin_director();
                }
            });
        }
        updateScreen(text, choices);
    }

    function admin_cafeteria() {
        let text = "📍 <b>식당</b><br><br>뒤집힌 식탁들 사이로 검은 로브를 입은 <b>[SCP-049]</b>가 연구원의 시체를 해부하고 있습니다.<br>당신을 발견하곤 천천히 다가옵니다. <i>'역병이 가득하군...'</i>";
        updateScreen(text, [
            { text: "재빨리 옆문을 통해 저위험군 격리구역으로 도망친다.", action: lcz_hub },
            { text: "탁자를 엎어 길을 막고 사무 구역 복도로 돌아간다.", action: () => {
                if(takeDamage(20)) return gameOver("도망치는 과정에서 SCP-049의 손끝이 스쳤고, 온몸이 마비되며 쓰러졌습니다.");
                admin_hub();
            }}
        ]);
    }

    // ==========================================
    // 루트 2: 유지보수 터널 (Maintenance) - 어둠과 전력
    // ==========================================

    function maintenance_hub() {
        let text = "📍 <b>지하 유지보수 터널</b><br><br>빛이 전혀 들어오지 않는 축축한 지하입니다. 파이프에서 물이 새는 소리만 들립니다.<br>어둠 속에서 무언가 무거운 것이 끌리는 소리가 들립니다...";
        updateScreen(text, [
            { text: "벽을 더듬어 메인 발전기실로 향한다.", action: generator_room },
            { text: "하수구 철창 쪽으로 이동한다.", action: sewer_grate },
            { text: "너무 어둡다. 계단을 다시 올라간다.", action: startIntro }
        ]);
    }

    function generator_room() {
        let text = "📍 <b>메인 발전기실</b><br><br>거대한 발전기들이 굉음을 내며 돌아가고 있습니다. 중앙 제어판에 '시설 메인 전력' 스위치가 있습니다.";
        let choices = [{ text: "터널로 돌아간다.", action: maintenance_hub }];

        if (!hasFlag("power_off")) {
            text += "<br>현재 전력 상태: <b style='color:#33ff33'>[ON]</b>";
            choices.unshift({ 
                text: "메인 전력을 [OFF]로 내린다.", 
                action: () => {
                    setFlag("power_off");
                    showNotification("시설 전체의 전력이 차단되었습니다! (보안 문 잠금 해제됨)");
                    generator_room();
                }
            });
        } else {
            text += "<br>현재 전력 상태: <b class='danger'>[OFF]</b><br>주변이 소름 끼치도록 고요해졌습니다.";
        }
        updateScreen(text, choices);
    }

    function sewer_grate() {
        let text = "📍 <b>하수구 배수구 앞</b><br><br>커다란 쇠창살이 시설 외부 하수구로 통하는 길을 막고 있습니다.";
        let choices = [{ text: "터널로 돌아간다.", action: maintenance_hub }];

        if (hasItem("쇠지렛대")) {
            if (hasFlag("power_off")) {
                text += "<br>전력이 차단되어 철창의 전자 잠금장치가 무력화되었습니다. 쇠지렛대로 뜯어낼 수 있을 것 같습니다!";
                choices.unshift({ text: "쇠지렛대로 철창을 뜯고 하수구로 탈출한다. (히든 엔딩)", action: ending_sewer });
            } else {
                text += "<br>쇠지렛대가 있지만, 전자 잠금장치에 고압 전류가 흐르고 있어 건드리면 감전될 것입니다.";
            }
        } else {
            text += "<br>철창을 맨손으로 열 수는 없습니다. 튼튼한 도구가 필요해 보입니다.";
        }
        updateScreen(text, choices);
    }

    // ==========================================
    // 루트 3: 저위험군 (LCZ) & 중위험군 (HCZ) - 정석 루트
    // ==========================================

    function lcz_hub() {
        let text = "📍 <b>저위험군 격리구역 (LCZ)</b><br><br>";
        if (hasFlag("power_off")) {
            text += "<span class='warning'>전력이 차단되어 비상등만 붉게 켜져 있습니다. 많은 전자문들이 열려 있습니다.</span><br><br>";
        }
        text += "복도 끝에 거대한 조각상 <b>[SCP-173]</b>이 보입니다. 눈을 깜빡이는 순간 목이 꺾일 것입니다.";
        
        updateScreen(text, [
            { text: "시선을 고정한 채 옆에 있는 방(SCP-914)으로 숨어 들어간다.", action: scp914_room },
            { text: "눈을 부릅뜨고 중위험군(HCZ) 검문소까지 뒷걸음질로 통과한다.", action: hcz_checkpoint }
        ]);
    }

    function scp914_room() {
        let text = "📍 <b>SCP-914 격리실</b><br><br>거대한 태엽 기계가 있습니다. 물건을 개조할 수 있습니다.";
        let choices = [{ text: "눈치를 보며 복도로 다시 나간다.", action: lcz_hub }];

        if (hasItem("1등급 키카드")) {
            text += "<br>가진 '1등급 키카드'를 넣어볼 수 있습니다.";
            choices.unshift({ text: "다이얼을 '고운(Fine)'에 맞추고 돌린다.", action: () => {
                removeItem("1등급 키카드"); addItem("3등급 키카드"); scp914_room();
            }});
        } else if (!hasFlag("got_level1") && !hasItem("3등급 키카드") && !hasItem("4등급 키카드")) {
            text += "<br>구석에 죽은 연구원이 <b>[1등급 키카드]</b>를 쥐고 있습니다.";
            choices.unshift({ text: "1등급 키카드를 챙긴다.", action: () => {
                setFlag("got_level1"); addItem("1등급 키카드"); scp914_room();
            }});
        }
        updateScreen(text, choices);
    }

    function hcz_checkpoint() {
        let text = "📍 <b>중위험군 격리구역 (HCZ) 검문소</b><br><br>육중한 방폭문이 길을 막고 있습니다.";
        
        if (hasFlag("power_off")) {
            text += "<br>전력이 차단되어 방폭문이 반쯤 열려 있습니다! 틈으로 비집고 들어갈 수 있습니다.";
            updateScreen(text, [{ text: "틈 사이로 비집고 들어간다.", action: hcz_hub }]);
        } else if (hasItem("3등급 키카드") || hasItem("4등급 키카드")) {
            text += "<br>소지하신 고등급 키카드로 문을 열 수 있습니다.";
            updateScreen(text, [{ text: "카드를 긁고 진입한다.", action: hcz_hub }]);
        } else {
            text += "<br>단말기에 [3등급 이상 권한 필요]라고 뜹니다. 키카드를 업그레이드하거나, 다른 방법을 찾아야 합니다.";
            updateScreen(text, [{ text: "저위험군 구역으로 돌아간다.", action: lcz_hub }]);
        }
    }

    function hcz_hub() {
        let text = "📍 <b>중위험군 격리구역 (HCZ) 내부</b><br><br>벽이 부식되어 끈적한 검은 액체가 흐르고 있습니다. <b>[SCP-106]</b>의 흔적입니다.<br>여기서부터는 곧장 출입 구역(지상 게이트)으로 가는 엘리베이터가 있습니다.";
        updateScreen(text, [
            { text: "검은 액체를 피해 조심스럽게 엘리베이터로 간다.", action: ez_hub },
            { text: "검은 액체가 나오는 구멍(포켓 디멘션)을 호기심에 들여다본다.", action: pocket_dimension }
        ]);
    }

    function pocket_dimension() {
        if (hasItem("4등급 키카드")) {
            gameOver("당신이 구멍을 들여다보는 순간, 부패한 손이 튀어나와 당신을 어둠 속으로 끌고 갔습니다.<br>당신은 고통스러운 이면의 차원에서 영원히 헤매게 되었습니다.<br><br><b>[배드 엔딩: 포켓 디멘션의 희생양]</b>");
        } else {
            gameOver("구멍에 가까이 가자마자 중력이 역전되며 어둠 속으로 빨려 들어갔습니다.<br><b>[배드 엔딩: 호기심이 고양이를 죽이다]</b>");
        }
    }

    // ==========================================
    // 루트 4: 출입 구역 (EZ) 및 지상 탈출
    // ==========================================

    function ez_hub() {
        let text = "📍 <b>출입 구역 (Entrance Zone)</b><br><br>로비가 엉망진창입니다. 방송이 울려 퍼집니다.<br><i>'알파 탄두 기폭 1분 전. 남은 인원 생존 보장 불가.'</i><br>지상으로 나가는 두 개의 게이트가 있습니다.";
        updateScreen(text, [
            { text: "게이트 A로 달린다. (혼돈의 반란 점령지)", action: gate_a },
            { text: "게이트 B로 달린다. (재단 MTF 점령지)", action: gate_b }
        ]);
    }

    function gate_a() {
        if (hasItem("4등급 키카드")) {
            gameWin("게이트를 나서자 무장한 '혼돈의 반란' 요원들이 총을 겨눕니다.<br>당신이 고위급의 상징인 4등급 키카드를 쥐고 있는 것을 본 그들은 당신을 주요 정보원으로 여겨 헬기에 태웠습니다.<br><br><b>[엔딩 A: 적과의 동침]</b><br>재단을 붕괴시킬 중요한 장기말이 되어 살아남았습니다.");
        } else {
            gameWin("게이트를 나서자 무장한 '혼돈의 반란' 요원들이 총을 겨눕니다.<br>당신의 오렌지색 D계급 복장을 본 그들은 당신을 '소모품' 생존자로 보고 임시 수용 차량에 밀어넣었습니다.<br><br><b>[엔딩 B: 혼돈 속으로]</b><br>자유는 없지만, 시설 폭발에서는 살아남았습니다.");
        }
    }

    function gate_b() {
        gameOver("게이트 B의 문이 열리자마자, 상공에 떠 있던 재단 특수 기동대(MTF) 헬리콥터가 기관총을 쏟아냅니다.<br><i>'격리 파기 개체 및 미확인 인원 사살 완료.'</i><br><br><b>[배드 엔딩: 무자비한 규정]</b>");
    }

    function ending_sewer() {
        gameWin("지렛대로 철창을 뜯어내고 오수관을 타고 미친듯이 미끄러져 내려갔습니다.<br>역겨운 냄새가 진동하지만, 멀리서 숲속의 맑은 공기가 느껴집니다.<br>등 뒤로 땅이 흔들리며 제19기지가 핵폭발로 지하에 묻히는 소리가 들립니다.<br><br><b>[진 엔딩: 아무도 모르는 탈출]</b><br>재단도, 반란군도 당신의 생존을 모릅니다. 당신은 완전한 자유를 얻었습니다.");
    }

    // ==========================================
    // 게임 오버 및 클리어 처리
    // ==========================================

    function gameOver(reason) {
        document.getElementById("hp-display").innerText = "0";
        document.getElementById("hp-display").className = "danger";
        const text = `<span class="danger">💀 <b>SYSTEM DOWN</b> 💀</span><br><br>${reason}`;
        updateScreen(text, [{ text: "루프 재시작 (처음으로)", action: startIntro }]);
    }

    function gameWin(endingText) {
        const text = `🎉 <b>탈출 시퀀스 완료</b> 🎉<br><br>${endingText}`;
        updateScreen(text, [{ text: "다른 분기점 찾아보기 (처음으로)", action: startIntro }]);
    }

    window.onload = startIntro;
</script>

</body>
</html>
